<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LøbeGarderoben</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏃 LøbeGarderoben</h1>
      <p>Din AI-drevne løbeassistent</p>
    </header>

    <!-- Vejr og Match -->
    <section class="card">
      <h2>Dagens Vejr & Match</h2>
      <button id="btn-location" class="action-btn">📍 Brug min GPS til vejr</button>
      
      <div id="weather-info" class="hidden">
        <p>Temperatur: <span id="temp">--</span>°C (Føles som: <span id="feels-like">--</span>°C)</p>
        <p>Vind: <span id="wind">--</span> m/s</p>
      </div>

      <div id="outfit-recommendation" class="hidden">
        <h3>Anbefalet Outfit:</h3>
        <ul id="outfit-list"></ul>
      </div>
    </section>

    <!-- Scan nyt tøj -->
    <section class="card">
      <h3>📸 Scan nyt løbetøj</h3>
      <p>Tag et billede af dit tøj – AI'en identificerer mærke og egenskaber automatisk.</p>
      
      <!-- Label fungerer direkte som knap på tværs af mobiler og PC -->
      <label for="camera-input" class="action-btn scan-btn-label" style="display: block; text-align: center; cursor: pointer; background-color: #10b981; color: white; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px;">
        📷 Åbn Kamera / Vælg Billede
      </label>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
      
      <p id="scan-status" style="margin-top: 10px; font-size: 14px; color: #555;"></p>
    </section>

    <!-- Mit Klædeskab -->
    <section class="card">
      <h3>👕 Mit Klædeskab</h3>
      <div id="wardrobe-list">
        <p class="empty-msg">Henter tøj fra databasen...</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
